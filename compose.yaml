services:
  poop2jb:
    build:
      context: .
    image: poop2jb:local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      ELFLDR_PORT: ${ELFLDR_PORT:-9021}
      PS5_HOST: ${PS5_HOST:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
